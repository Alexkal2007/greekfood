<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Οι Συνταγές της Γιαγιάς</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --aegean:#1B4B5A;
    --aegean-deep:#123640;
    --whitewash:#F7F3EA;
    --olive:#6B7A45;
    --paprika:#C1440E;
    --ochre:#D4A24C;
    --line: rgba(27,75,90,0.15);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--whitewash);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(27,75,90,0.07) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--aegean-deep);
    font-family:'Karla', sans-serif;
    min-height:100vh;
  }

  h1,h2,h3, .display{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
  }

  /* ---------- HEADER ---------- */
  header{
    padding: 56px 24px 32px;
    text-align:center;
    position:relative;
  }
  .eyebrow{
    letter-spacing:.28em;
    text-transform:uppercase;
    font-size:12px;
    color:var(--paprika);
    font-weight:700;
    margin-bottom:10px;
  }
  header h1{
    font-size:clamp(40px, 7vw, 68px);
    margin:0;
    color:var(--aegean-deep);
    line-height:1;
  }
  header h1 em{
    font-style:italic;
    color:var(--paprika);
  }
  .subtitle{
    margin-top:14px;
    font-size:16px;
    color:#4c6470;
    max-width:480px;
    margin-left:auto;
    margin-right:auto;
  }
  .olive-divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-top:26px;
    color:var(--olive);
  }
  .olive-divider .stem{
    height:1px;
    width:60px;
    background:var(--line);
  }

  /* ---------- HOME LAYOUT ---------- */
  #home-layout{
    max-width:1200px;
    margin:0 auto;
    padding: 0 24px 100px;
    display:flex;
    gap:40px;
    align-items:flex-start;
  }

  /* ---------- SIDEBAR ---------- */
  #sidebar{
    width:220px;
    min-width:200px;
    position:sticky;
    top:24px;
  }
  .sidebar-title{
    font-size:11px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--paprika);
    font-weight:700;
    margin-bottom:14px;
    padding-bottom:10px;
    border-bottom:1px solid var(--line);
  }
  .cat-group{
    margin-bottom:6px;
  }
  .cat-btn{
    width:100%;
    background:none;
    border:none;
    cursor:pointer;
    font-family:'Karla',sans-serif;
    font-size:14px;
    font-weight:700;
    color:var(--aegean-deep);
    text-align:left;
    padding:9px 12px;
    border-radius:8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    transition:background .2s, color .2s;
  }
  .cat-btn:hover{ background:rgba(27,75,90,0.08); }
  .cat-btn.active{
    background:var(--aegean-deep);
    color:var(--whitewash);
  }
  .cat-count{
    font-size:11px;
    font-weight:400;
    opacity:.7;
  }

  /* ---------- GRID ---------- */
  #gallery{
    flex:1;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(190px, 1fr));
    gap:34px 22px;
  }

  .plate-card{
    background:none;
    border:none;
    cursor:pointer;
    padding:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    font-family:inherit;
    color:inherit;
    text-align:center;
    transition: transform .35s cubic-bezier(.2,.8,.2,1);
    position:relative;
  }
  .plate-card:hover{ transform: translateY(-6px); }
  .plate-card:focus-visible{
    outline:2px solid var(--paprika);
    outline-offset:6px;
    border-radius:50%;
  }

  .plate{
    width:150px;
    height:150px;
    border-radius:50%;
    background:#ffffff;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.8) inset,
      0 14px 26px -12px rgba(18,54,64,0.35);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    border: 6px solid #ffffff;
    outline: 1px solid var(--line);
    overflow:hidden;
  }
  .plate img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .plate::after{
    content:"";
    position:absolute;
    inset:10px;
    border-radius:50%;
    border:1px dashed rgba(255,255,255,0.55);
    pointer-events:none;
  }

  .plate img[src=""] { display:none; }

  .gourmet-badge{
    position:absolute;
    top:-4px;
    right:-4px;
    background:var(--paprika);
    color:#fff;
    font-size:9px;
    font-weight:700;
    letter-spacing:.1em;
    padding:4px 8px;
    border-radius:999px;
    box-shadow:0 4px 10px -4px rgba(193,68,14,0.6);
    border:2px solid var(--whitewash);
  }

  .food-name{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:21px;
    line-height:1.15;
  }
  .food-tag{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--olive);
    font-weight:700;
  }

  /* ---------- DETAIL PAGE ---------- */
  #detail{
    display:none;
    max-width:760px;
    margin:0 auto;
    padding: 40px 24px 100px;
    animation: fadeUp .5s ease both;
  }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:none;
    border:1px solid var(--line);
    color:var(--aegean-deep);
    font-family:'Karla',sans-serif;
    font-size:13px;
    font-weight:700;
    letter-spacing:.05em;
    padding:10px 18px;
    border-radius:999px;
    cursor:pointer;
    margin-bottom:34px;
    transition: background .2s, color .2s, border-color .2s;
  }
  .back-btn:hover{
    background:var(--aegean-deep);
    color:var(--whitewash);
    border-color:var(--aegean-deep);
  }

  .detail-hero{
    display:flex;
    align-items:center;
    gap:28px;
    margin-bottom:10px;
  }
  .detail-plate{
    width:110px;
    height:110px;
    min-width:110px;
    border-radius:50%;
    background:#fff;
    border:5px solid #fff;
    outline:1px solid var(--line);
    box-shadow: 0 12px 22px -10px rgba(18,54,64,0.35);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .detail-plate img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  #detail h2{
    font-size:clamp(30px, 5vw, 44px);
    margin:0 0 6px;
    color:var(--aegean-deep);
  }
  #detail .food-tag{ font-size:12px; }

  .detail-blurb{
    margin: 22px 0 38px;
    font-size:16px;
    line-height:1.7;
    color:#3d5560;
    border-left:3px solid var(--ochre);
    padding-left:18px;
  }

  .section-title{
    display:flex;
    align-items:baseline;
    gap:12px;
    margin: 0 0 18px;
  }
  .section-title h3{
    font-size:24px;
    margin:0;
    color:var(--paprika);
  }
  .section-title .stem{
    flex:1;
    height:1px;
    background:var(--line);
  }

  #ingredients{
    list-style:none;
    padding:0;
    margin:0 0 42px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(200px,1fr));
    gap:10px 20px;
  }
  #ingredients li{
    font-size:15px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    display:flex;
    gap:10px;
  }
  #ingredients li::before{
    content:"○";
    color:var(--olive);
    font-size:10px;
    position:relative;
    top:5px;
  }

  #steps{
    list-style:none;
    padding:0;
    margin:0;
    counter-reset: step;
  }
  #steps li{
    counter-increment: step;
    position:relative;
    padding:0 0 26px 46px;
    font-size:15.5px;
    line-height:1.7;
  }
  #steps li::before{
    content: counter(step);
    position:absolute;
    left:0; top:0;
    width:32px; height:32px;
    border-radius:50%;
    background:var(--aegean-deep);
    color:var(--whitewash);
    font-family:'Cormorant Garamond',serif;
    font-weight:700;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #steps li:not(:last-child)::after{
    content:"";
    position:absolute;
    left:15px; top:32px;
    width:1px;
    height:calc(100% - 32px);
    background:var(--line);
  }

  footer{
    text-align:center;
    font-size:12px;
    color:#8098a2;
    padding-bottom:40px;
    letter-spacing:.05em;
  }

  @media (prefers-reduced-motion: reduce){
    .plate-card, #detail{ transition:none; animation:none; }
  }
  @media (max-width: 680px){
    #home-layout{ flex-direction:column; padding:0 16px 80px; }
    #sidebar{ width:100%; position:static; }
    #gallery{ grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap:22px 14px; }
    .plate{ width:120px; height:120px; }
  }
</style>
</head>

<header id="home-header">

  <h1>Συνταγές <em>της Γιαγιάς</em></h1>

  <div class="olive-divider"><span class="stem"></span>🫒<span class="stem"></span></div>
</header>

<div id="home-layout">

  <main id="gallery"></main>

<section id="detail">

  <ul id="ingredients"></ul>

  <div class="section-title"><h3>Εκτέλεση</h3><span class="stem"></span></div>
  <ol id="steps"></ol>
</section>

<footer>Συνταγές της Γιαγιάς · Παραδοσιακές ελληνικές συνταγές</footer>

const gallery = document.getElementById('gallery');
const detail = document.getElementById('detail');
const homeHeader = document.getElementById('home-header');
const homeLayout = document.getElementById('home-layout');
const catList = document.getElementById('cat-list');

// Ορισμός κατηγοριών και ποια tag ανήκουν σε κάθε μία
const categories = [
  { label: "Όλα",           match: null },
  { label: "Κυρίως Πιάτο", match: ["Κυρίως πιάτο","Κλασικό · Κυρίως πιάτο","Γκουρμέ · Κυρίως πιάτο"] },
  { label: "Ορεκτικά",     match: ["Ορεκτικό","Ορεκτικό / Πίτα","Κλασικό · Ορεκτικό"] },
  { label: "Σαλάτες",      match: ["Κλασικό · Σαλάτα"] },
  { label: "Σούπες",       match: ["Σούπα / Νηστίσιμο","Κλασικό · Σούπα"] },
  { label: "Νηστίσιμα",    match: ["Κλασικό · Νηστίσιμο"] },
  { label: "Θαλασσινά",    match: ["Γκουρμέ · Θαλασσινά"] },
  { label: "Γλυκά",        match: ["Κλασικό · Γλυκό"] },
  { label: "Γκουρμέ",      match: null, gourmet: true },
];

let activeCategory = 0;

function countForCategory(cat) {
  if (cat.match === null && !cat.gourmet) return dishes.length;
  if (cat.gourmet) return dishes.filter(d => d.level === 'gourmet').length;
  return dishes.filter(d => cat.match.includes(d.tag)).length;
}

function buildSidebar() {
  catList.innerHTML = '';
  categories.forEach((cat, i) => {
    const count = countForCategory(cat);
    if (count === 0) return;
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (i === activeCategory ? ' active' : '');
    btn.innerHTML = `${cat.label} <span class="cat-count">${count}</span>`;
    btn.addEventListener('click', () => {
      activeCategory = i;
      buildSidebar();
      renderGallery();
    });
    catList.appendChild(btn);
  });
}

function dishMatchesCategory(dish, catIndex) {
  const cat = categories[catIndex];
  if (cat.match === null && !cat.gourmet) return true;
  if (cat.gourmet) return dish.level === 'gourmet';
  return cat.match.includes(dish.tag);
}

function renderGallery() {
  gallery.innerHTML = '';
  dishes.forEach((dish, i) => {
    if (!dishMatchesCategory(dish, activeCategory)) return;
    const card = document.createElement('button');
    card.className = 'plate-card';
    card.dataset.idx = i;
    card.innerHTML = `
      <div class="plate">
        <img src="${dish.image}" alt="${dish.name}" loading="lazy">
      </div>
      ${dish.level === 'gourmet' ? '<span class="gourmet-badge">ΓΚΟΥΡΜΕ</span>' : ''}
      <div class="food-tag">${dish.tag}</div>
      <div class="food-name">${dish.name}</div>
    `;
    card.addEventListener('click', () => openDish(i));
    gallery.appendChild(card);
  });
}

buildSidebar();
renderGallery();



function refreshCardImage(idx) {
  document.querySelectorAll(".plate-card[data-idx]").forEach(card => {
    if (parseInt(card.dataset.idx) === idx) {
      const img = card.querySelector("img");
      if (img) img.src = dishes[idx].image;
      const spinner = card.querySelector(".img-loader");
      if (spinner) spinner.remove();
    }
  });
  const detailImg = document.querySelector("#detail-emoji img");
  if (detailImg && detailImg.alt === dishes[idx].name) detailImg.src = dishes[idx].image;
}

function openDish(i){
  const d = dishes[i];
  document.getElementById('detail-emoji').innerHTML = `<img src="${d.image}" alt="${d.name}">`;
  document.getElementById('detail-tag').textContent = d.tag;
  document.getElementById('detail-name').textContent = d.name;
  document.getElementById('detail-blurb').textContent = d.blurb;

  const ing = document.getElementById('ingredients');
  ing.innerHTML = '';
  d.ingredients.forEach(item => {
    const li = document.createElement('li');
    li.textContent = item;
    ing.appendChild(li);
  });

  const steps = document.getElementById('steps');
  steps.innerHTML = '';
  d.steps.forEach(item => {
    const li = document.createElement('li');
    li.textContent = item;
    steps.appendChild(li);
  });

  homeHeader.style.display = 'none';
  homeLayout.style.display = 'none';
  detail.style.display = 'block';
  window.scrollTo({top:0, behavior:'smooth'});
}

function showGallery(){
  detail.style.display = 'none';
  homeHeader.style.display = 'block';
  homeLayout.style.display = 'flex';
  window.scrollTo({top:0, behavior:'smooth'});
}
</script>
